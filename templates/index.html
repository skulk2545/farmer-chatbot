<!DOCTYPE html>
<html>
<head>
  <title>Farmer Chatbot</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f1f8e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* 🌟 Opening Page */
    #openingPage {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #4CAF50, #81C784);
      z-index: 9999;
      transition: opacity 1s ease;
      color: white;
      text-align: center;
    }

    .emoji-logo {
      font-size: 4em;
      margin-bottom: 15px;
      animation: fadeIn 2s ease-in-out;
    }

    .title {
      font-size: 2.5em;
      font-weight: 600;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 0.5s;
    }

    .subtitle {
      font-size: 1.2em;
      margin-top: 10px;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 1.2s;
    }

    /* Classy Progress Bar */
    .progress {
      margin-top: 25px;
      width: 220px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-bar {
      width: 0;
      height: 100%;
      background: #ffeb3b;
      animation: load 3s linear forwards;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes load {
      from { width: 0; }
      to { width: 100%; }
    }

    /* 🌟 Chat Page */
    .container {
      display: none;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      width: 500px;
      max-width: 90%;
      overflow: hidden;
      flex-direction: column;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    #chatbox {
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 1.2em;
    }
    .message {
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: #d4edda;
      color: #155724;
      border-bottom-right-radius: 0;
    }
    .bot {
      align-self: flex-start;
      background: #e3f2fd;
      color: #0d47a1;
      border-bottom-left-radius: 0;
    }
    .input-area {
      display: flex;
      padding: 10px;
      background: #fafafa;
    }
    input {
      flex: 1;
      padding: 14px;
      font-size: 1.2em;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.2s;
    }
    input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76,175,80,0.3);
    }
    button {
      margin-left: 8px;
      padding: 12px 15px;
      font-size: 1.2em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .send-btn {
      background: #4CAF50;
      color: white;
    }
    .voice-btn {
      background: #ff9800;
      color: white;
    }
    select {
      font-size: 0.9em;
      padding: 4px;
      border-radius: 5px;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- 🌟 Opening Page -->
  <div id="openingPage">
    <div class="emoji-logo">👨‍🌾🌾</div>
    <div class="title">Farmer Advisory Chatbot</div>
    <div class="subtitle">Smart farming assistant, at your service</div>
    <div class="progress"><div class="progress-bar"></div></div>
  </div>

  <!-- 🌟 Chat Page -->
  <div class="container" id="chatContainer">
    <header>
      🌾 Farmer Advisory Chatbot
      <select id="langSelect">
        <option value="auto">Auto Detect</option>
        <option value="en">English</option>
        <option value="ml">Malayalam</option>
        <option value="hi">Hindi</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
      </select>
    </header>
    <div id="chatbox"></div>
    <div class="input-area">
      <input type="text" id="user_input" placeholder="Ask your farming question...">
      <button class="send-btn" onclick="sendMessage()">Send</button>
      <button class="voice-btn" onclick="startVoice()">🎤</button>
    </div>
  </div>

  <script>
    // Auto hide splash after 3 seconds with fade
    window.onload = function() {
      setTimeout(() => {
        let splash = document.getElementById("openingPage");
        splash.style.opacity = 0;
        setTimeout(() => {
          splash.style.display = "none";
          document.getElementById("chatContainer").style.display = "flex";
        }, 1000); 
      }, 3000);
    }

    function sendMessage() {
      let input = document.getElementById("user_input").value;
      let langChoice = document.getElementById("langSelect").value;
      if (input.trim() === "") return;

      fetch("/get", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ msg: input, lang: langChoice })
      })
      .then(res => res.json())
      .then(data => {
        let chatbox = document.getElementById("chatbox");
        chatbox.innerHTML += `<div class="message user"><b>You:</b> ${input}</div>`;
        chatbox.innerHTML += `<div class="message bot"><b>Bot:</b> ${data.reply}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        speakText(data.reply, langChoice);
      });

      document.getElementById("user_input").value = "";
    }

    function startVoice() {
      if ('webkitSpeechRecognition' in window) {
        let recognition = new webkitSpeechRecognition();
        recognition.lang = "en-IN";
        recognition.start();

        recognition.onresult = function(event) {
          let voiceText = event.results[0][0].transcript;
          document.getElementById("user_input").value = voiceText;
          sendMessage();
        }
      } else {
        alert("Voice recognition not supported in this browser. Please use Chrome.");
      }
    }

    function speakText(text, langChoice) {
      let speech = new SpeechSynthesisUtterance(text);
      if (langChoice !== "auto") {
        speech.lang = langChoice;
      } else {
        speech.lang = "en-IN";
      }
      window.speechSynthesis.speak(speech);
    }
  </script>
</body>
</html>
