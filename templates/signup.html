<!DOCTYPE html>
<html>
<head>
  <title>Signup - Farmer Chatbot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow-lg p-4 mx-auto" style="max-width: 500px;">
      <h3 class="text-center mb-3">🌱 Signup</h3>
      <form method="POST">
        <div class="mb-3">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Location</label>
          <input type="text" name="location" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Crop</label>
          <input type="text" name="crop" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Soil Type</label>
          <input type="text" name="soil_type" class="form-control" required>
        </div>
        <button class="btn btn-success w-100">Signup</button>
      </form>
      <p class="text-center mt-3">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
</body>
</html>
