<!DOCTYPE html>
<html>
<head>
  <title>Login - Farmer Chatbot</title>
  <style>
    body { font-family: Arial; background:#f1f8e9; display:flex; justify-content:center; align-items:center; height:100vh; }
    .form-box { background:#fff; padding:30px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.2); width:300px; }
    input { width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #ccc; }
    button { width:100%; padding:10px; background:#4CAF50; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    a { text-decoration:none; color:#4CAF50; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Login</h2>
    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>No account? <a href="{{ url_for('signup') }}">Signup</a></p>
  </div>
</body>
</html>
